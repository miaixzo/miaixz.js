# Validates a version tag and publishes or resumes publication of the matching package tarballs.
name: NPM Registry

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to republish or resume."
        required: true
        type: string
  push:
    tags:
      - "*.*.*"

env:
  NODE_VERSION: "24.x"
  NPM_REGISTRY: "https://registry.npmjs.org/"
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

permissions:
  actions: read
  contents: read

concurrency:
  group: npm-release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve Validated Main Artifact
    if: ${{ github.repository == 'miaixzo/miaixz.js' }}
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.validation.outputs.artifact-name }}
      commit: ${{ steps.release.outputs.commit }}
      is-prerelease: ${{ steps.release.outputs.is-prerelease }}
      run-id: ${{ steps.validation.outputs.run-id }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check Out Existing Tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Set Up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Verify Existing Tag and Metadata
        id: release
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/${TAG}" || {
            echo "::error::Tag '${TAG}' does not exist"
            exit 1
          }
          tag_commit="$(git rev-parse "${TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$head_commit" != "$tag_commit" ]; then
            echo "::error::Checked-out HEAD does not equal the peeled tag commit"
            exit 1
          fi
          release_version="$(tr -d '\r\n' < VERSION)"
          if [ "$TAG" != "$release_version" ]; then
            echo "::error::Release tag '${TAG}' does not match VERSION '${release_version}'"
            exit 1
          fi
          npm run release:verify
          npm run check:clean
          if [[ "$release_version" == *-* ]]; then
            is_prerelease=true
          else
            is_prerelease=false
          fi
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "is-prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

      - name: Resolve Successful Main Validation
        id: validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail
          run_id="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/build-project.yml/runs" \
              -f branch=main \
              -f event=push \
              -f status=success \
              -f head_sha="$TAG_COMMIT" \
              -f per_page=100 \
              --jq '.workflow_runs | map(select(.head_sha == "'"$TAG_COMMIT"'" and .head_branch == "main" and .event == "push" and .conclusion == "success")) | first | .id // empty'
          )"
          if [ -z "$run_id" ]; then
            echo "::error::No successful main Build Project run exists for ${TAG_COMMIT}"
            exit 1
          fi
          artifact_name="packages-${TAG_COMMIT}"
          artifact_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
              --jq '.artifacts | map(select(.name == "'"$artifact_name"'" and .expired == false)) | first | .id // empty'
          )"
          if [ -z "$artifact_id" ]; then
            echo "::error::Validated artifact '${artifact_name}' is unavailable in run ${run_id}"
            exit 1
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact-name=$artifact_name" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish Validated Tarballs
    needs: resolve
    if: ${{ needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    environment:
      name: release
      url: https://www.npmjs.com/search?q=%40miaixz
    outputs:
      version: ${{ needs.resolve.outputs.version }}
      is-prerelease: ${{ needs.resolve.outputs.is-prerelease }}
    steps:
      - name: Check Out Existing Tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Set Up Node.js and npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.NPM_REGISTRY }}
          package-manager-cache: false

      - name: Download Validated Tarballs
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ${{ needs.resolve.outputs.artifact-name }}
          path: ${{ runner.temp }}/packages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve.outputs.run-id }}

      - name: Verify Validated Tarball Digests
        working-directory: ${{ runner.temp }}/packages
        run: sha256sum --check SHA256SUMS

      - name: Publish All Packages to npm
        uses: ./.github/actions/npm-registry
        with:
          registry: ${{ env.NPM_REGISTRY }}
          package-directory: ${{ runner.temp }}/packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  create-release:
    name: Create Release After npm Publication
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    permissions:
      contents: write
    uses: ./.github/workflows/create-release.yml
    with:
      tag: ${{ needs.publish.outputs.version }}
      prerelease: ${{ needs.publish.outputs.is-prerelease == 'true' }}
