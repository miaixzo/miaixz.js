name: Build Project

on:
  workflow_call:
    inputs:
      target-ref:
        description: "Git ref to validate."
        required: false
        type: string
      artifact-key:
        description: "Stable key used for same-run artifacts."
        required: false
        type: string
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags-ignore:
      - "*"

permissions:
  contents: read

env:
  ARTIFACT_KEY: ${{ inputs['artifact-key'] || github.sha }}
  FONTBAKERY_VERSION: "1.1.0"
  FONTMAKE_VERSION: "3.12.1"
  FONTTOOLS_VERSION: "4.66.0"
  PYTHON_VERSION: "3.13.18"
  TARGET_REF: ${{ inputs['target-ref'] || github.ref }}
  UFO2FT_VERSION: "3.9.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Self-contained workspace build
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_REF }}

      - name: Set Up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Set Up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: ""

      - name: Install Hash-Locked Font Tools
        run: npm run font:toolchain:install

      - name: Verify Exact Font Toolchain
        run: |
          set -euo pipefail
          test "$(python --version)" = "Python ${PYTHON_VERSION}"
          test "$(fontmake --version)" = "${FONTMAKE_VERSION}"
          pip freeze --all > "${RUNNER_TEMP}/font-toolchain.txt"
          grep -Fx "fonttools==${FONTTOOLS_VERSION}" "${RUNNER_TEMP}/font-toolchain.txt"
          grep -Fx "ufo2ft==${UFO2FT_VERSION}" "${RUNNER_TEMP}/font-toolchain.txt"
          grep -Fx "fontbakery==${FONTBAKERY_VERSION}" "${RUNNER_TEMP}/font-toolchain.txt"

      - name: Install JavaScript Dependencies
        run: npm ci --package-lock=true --ignore-scripts --legacy-peer-deps

      - name: Build and Validate Workspaces
        run: npm run build

      - name: Stage Workspace Build Output
        run: npm run package:stage -- "${{ runner.temp }}/workspace-dist"

      - name: Upload Workspace Build
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dist-${{ env.ARTIFACT_KEY }}
          path: ${{ runner.temp }}/workspace-dist
          if-no-files-found: error

      - name: Verify Clean Workspace
        run: npm run check:clean

  static:
    name: Static (Node ${{ matrix.node }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - "20.x"
          - "24.x"
    steps:
      - name: Check Out Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_REF }}

      - name: Set Up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Set Up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: ""

      - name: Install Hash-Locked Font Tools
        run: npm run font:toolchain:install

      - name: Install Dependencies
        run: npm ci --package-lock=true --ignore-scripts --legacy-peer-deps

      - name: Install Browser Runtimes
        run: npm exec -- playwright install --with-deps chromium firefox webkit

      - name: Download Same-Commit Build
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: dist-${{ env.ARTIFACT_KEY }}
          path: .

      - name: Run Static Checks
        run: npm run check:static

      - name: Audit Dependencies and Exceptions
        run: npm run audit:dependencies

      - name: Verify Clean Workspace
        run: npm run check:clean

  projects:
    name: Standalone Projects
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_REF }}

      - name: Set Up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Download Same-Commit Build
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: dist-${{ env.ARTIFACT_KEY }}
          path: .

      - name: Install Repository Dependencies
        run: npm run install:all

      - name: Check Standalone Projects
        run: npm run check:projects

  browser:
    name: Browser Contracts
    needs: [static, projects]
    runs-on: macos-latest
    steps:
      - name: Check Out Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_REF }}

      - name: Set Up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Install Dependencies
        run: npm ci --package-lock=true --ignore-scripts --legacy-peer-deps

      - name: Download Same-Commit Build
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: dist-${{ env.ARTIFACT_KEY }}
          path: .

      - name: Install Browser Runtimes
        run: npm exec -- playwright install chromium firefox webkit

      - name: Run Browser Checks
        run: npm run check:browser

      - name: Verify Clean Workspace
        run: npm run check:clean

  packed:
    name: Packed Consumers
    needs: [static, projects]
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_REF }}

      - name: Set Up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Install Dependencies
        run: npm ci --package-lock=true --ignore-scripts --legacy-peer-deps

      - name: Download Same-Commit Build
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: dist-${{ env.ARTIFACT_KEY }}
          path: .

      - name: Install Packed Browser Runtime
        run: npm exec -- playwright install --with-deps chromium

      - name: Run Packed Consumer Checks
        run: npm run check:package
        env:
          MIAIXZ_PACKAGE_OUTPUT: ${{ runner.temp }}/packages

      - name: Upload Validated Tarballs
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: packages-${{ env.ARTIFACT_KEY }}
          path: ${{ runner.temp }}/packages
          if-no-files-found: error

      - name: Verify Clean Workspace
        run: npm run check:clean
