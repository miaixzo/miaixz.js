<!doctype html>
<!--
  Hosts the Office and spreadsheet browser fixtures in a full-size preview root.
-->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XLSX browser preview acceptance</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: #ffffff;
      }

      .miaixz-preview {
        width: 100%;
        height: 100%;
      }

      .miaixz-preview-workbook {
        width: 100%;
        max-width: none;
        height: 100%;
        max-height: none;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./browser-host.tsx"></script>
  </body>
</html>
